matrix_id = "exp2.2-matrix_sweep_msg+Tr"
solver = "pulp"
solver_gap = 0.05
solver_time_limit = 120
solver_threads = 8
solver_seed = 1
program_config = "config/program.toml"

# Legacy key: numeric payloads are decimal MB, passed unchanged to m.
message_sizes_mib = [0.125, 0.5, 2.0, 8.0, 32.0, 128.0, 512.0]  # in MB
algorithms = ["ar_having-doubling", "a2a_pairwise", "a2a_bruck"]

[topology]
# k: number of OCS (can be a single value or list)
k = 4
# p: number of compute nodes (sweep over multiple values)
p = 256
# Bandwidth per link (decimal GB/s = MB/ms)
B = 25  # 200 Gbps per link
# Sweep reconfiguration times (ms)
T_reconf = [0.02, 0.2, 2.0, 20.0]
T_lat = 0.02

[output]
config_dir  = "logs/generated_configs/exp2.2-matrix_sweep_msg+Tr"
results_csv = "logs/matrix_results-exp2.2-matrix_sweep_msg+Tr.csv"
